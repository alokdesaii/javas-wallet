<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"><!-- preview in review: remove at launch -->
<title>Wallet — Javas Exchange</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#25165b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
<!-- brand.css / app.css / theme.js are copied verbatim from the web app — keep them in sync, don't fork -->
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
<style>
/* ============================================================
   Javas Wallet — the exchange's self-contained wallet app.
   Same tokens, cut-corner buttons, mono section markers and
   ledger rules as the web and mobile apps. Mobile-first: one
   column, bottom tab bar, sheets instead of dialogs.
   ============================================================ */
body{display:block;background:var(--stage)}
/* the phone column on a wider screen — same as the exchange mobile app: a 430px canvas
   strip on a lilac-grey stage, lifted by a soft purple halo */
:root{--stage:#e9e6ee;--halo:0 0 0 1px var(--rule-soft),0 0 90px -10px rgba(37,22,91,.22)}
:root[data-theme="dark"]{--stage:#0c0a10;--halo:0 0 0 1px var(--rule),0 0 90px -10px rgba(155,134,216,.18)}
.app,.gate,.splash{box-shadow:var(--halo)}            /* app.css lays out a sidebar grid; the wallet has none */
.app{max-width:430px;min-height:100dvh;margin:0 auto;background:var(--canvas);display:flex;flex-direction:column;
  border-inline:1px solid var(--rule-soft);padding-bottom:calc(72px + env(safe-area-inset-bottom))}

/* header */
.hd{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);
  background:var(--canvas);border-bottom:1px solid var(--rule)}
.hd .logo{padding:0;gap:10px}
.hd .logo svg{height:24px}
.hd .logo b{font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink)}
.hd .logo b span{color:var(--ink-3);font-weight:400}
.hd h1{font-size:var(--t-h3);font-weight:600;flex:1}
.hd .sp{flex:1}
.ib{width:40px;height:40px;flex:none;display:grid;place-items:center;border:1px solid var(--rule-strong);border-radius:var(--r);
  background:transparent;color:var(--ink-2);font-size:18px;cursor:pointer;position:relative}
.ib:hover{background:var(--tint);color:var(--ink)}
.ib.bare{border-color:transparent}
.ib .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 0 2px var(--canvas)}

.pg{padding:var(--s4);display:grid;gap:var(--s4);align-content:start}
.pg > .lead-k{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.pg > .lead-k::before{content:"";width:8px;height:8px;background:var(--signal)}

/* hero balance — the dashboard's lilac panel */
.hero{background:var(--hero);border-color:transparent;padding:var(--s5)}
.k{font-size:var(--t-meta);letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.kh{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
.eye{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:4px 6px;margin:-4px;font:inherit;
  font-size:var(--t-label);color:var(--ink-3);cursor:pointer;border-radius:var(--r-sm)}
.eye:hover{color:var(--ink)}
.figure{font-size:34px;font-weight:600;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:8px}
.eq{margin-top:6px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pnl{margin-top:var(--s3);font-size:13px;font-weight:500}
.wsel{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  border:1px solid rgba(37,22,91,.22);background:transparent;color:var(--ink-2);padding:4px 8px;border-radius:var(--r-sm);cursor:pointer}
:root[data-theme="dark"] .wsel{border-color:rgba(255,255,255,.18)}
.alloc{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:var(--s5)}
.alloc i{display:block;min-width:3px}

/* four primary actions — the dashboard's pastel tiles, square and compact */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s3) 0;border:0;border-radius:var(--r-md);
  background:var(--tone);color:var(--deep);font:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:transform .16s var(--ease)}
.qa button:hover{transform:translateY(-2px)}
.qa i{font-size:22px}
.blush{--tone:#f7dcd9}.sand{--tone:#f8e7c2}.lilac{--tone:#ded6f0}.mist{--tone:#e5e1ea}
:root[data-theme="dark"] .qa button{opacity:.92}

/* segmented control, from the web wallet dialog */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden}
.seg button{border:0;min-height:36px;background:var(--sheet);font:inherit;font-size:13px;font-weight:500;color:var(--ink-3);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--deep);color:#fff}

/* asset rows */
.row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--rule-soft);width:100%;
  background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover .nm{color:var(--accent)}
.row .m{flex:1;min-width:0}
.row .nm{font-weight:500}
.row .sm{font-size:var(--t-label);color:var(--ink-3)}
.row .r{text-align:right;font-variant-numeric:tabular-nums}
.row .r .sm{display:block}
.coin.lg{width:44px;height:44px;font-size:18px}

/* sheets — bottom drawers, the mobile counterpart of the web dialog */
.sheet{border:0;padding:0;margin:auto auto 0;width:min(430px,100vw);max-width:100vw;max-height:92dvh;
  background:var(--sheet-raised);color:var(--ink);border-top:1px solid var(--rule-strong)}
.sheet::backdrop{background:rgba(20,13,36,.45)}
.sheet[open]{animation:up .28s var(--ease)}
@keyframes up{from{translate:0 40px;opacity:0}}
.sheet .in{padding:var(--s4) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));display:grid;gap:var(--s4)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--rule-strong);margin:0 auto}
.sheet .sh{display:flex;align-items:center;justify-content:space-between}
.sheet h2{font-size:var(--t-h3);font-weight:600}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:3px;background:var(--rule)}
.steps i.on{background:var(--signal)}

.unit{position:relative}.unit input{padding-right:96px}
.unit .u{position:absolute;right:10px;top:50%;translate:0 -50%;display:flex;gap:8px;align-items:center;font-size:var(--t-label);color:var(--ink-3)}
.unit .u button,.link{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;font-size:var(--t-label)}
.big-in{font-size:28px;font-weight:600;min-height:56px;font-variant-numeric:tabular-nums}
.fl label{display:flex;justify-content:space-between;margin-bottom:5px}
.fl label b{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.info{display:grid;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden}
.info div{display:flex;justify-content:space-between;gap:var(--s3);padding:9px 12px;font-size:13px;border-top:1px solid var(--rule-soft)}
.info div:first-child{border-top:0}
.info span{color:var(--ink-3)}
.info b{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.warn{font-size:var(--t-label);color:var(--ink-2);line-height:1.55;padding:10px 12px;border-left:3px solid var(--flag);background:var(--sheet-sunk)}
.err{font-size:var(--t-label);color:var(--loss);margin-top:6px}
.qrbox{display:grid;justify-items:center;gap:var(--s3);padding:var(--s4);border:1px solid var(--rule);background:var(--sheet)}
.qr{width:184px;height:184px;padding:10px;background:#fff;border:1px solid var(--rule)}
.qr svg{display:block;width:100%;height:100%}
code.ad{display:block;width:100%;font-family:var(--mono);font-size:12px;word-break:break-all;text-align:center;padding:10px;background:var(--sheet-sunk)}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.btn.full{width:100%;min-height:48px}
.swapx{display:grid;place-items:center;margin:-6px 0}
.swapx button{width:36px;height:36px;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink-2);cursor:pointer;font-size:18px;display:grid;place-items:center}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.otp input{text-align:center;font-family:var(--mono);font-size:20px;min-height:52px;padding:0}
.done{display:grid;justify-items:center;gap:var(--s2);text-align:center;padding:var(--s5) 0}
.done i{font-size:44px;color:var(--gain)}
.done b{font-size:var(--t-h3)}
.done p{color:var(--ink-3);font-size:13px;max-width:30ch}

/* ============================================================
   Gate screens — splash, first-run setup, lock. Drawn straight from
   the exchange mobile login: light canvas with ruled columns, the
   spaced wordmark, white labelled inputs, deep-purple segmented
   control, coral cut-corner CTA in mono caps, ruled keypad.
   ============================================================ */
.gate{position:fixed;top:0;bottom:0;left:50%;width:min(430px,100%);translate:-50% 0;z-index:20;overflow:auto;
  background:var(--canvas);
  background-image:repeating-linear-gradient(90deg,transparent 0 calc(33.333% - 1px),var(--rule) calc(33.333% - 1px) 33.333%)}
.onb{z-index:25}
.gate .wrap{min-height:100dvh;padding:var(--s4) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:var(--s4)}
.gate .grow{flex:1}
/* text that crosses a column rule gets the canvas behind it, as on the web app's header */
.gate h2,.gate .sub,.gate .brand .wm,.gate .brand p,.gate .fine,.gate .or span,.gate .row2 > *{background:var(--canvas)}

.gbar{display:flex;align-items:center;gap:var(--s3);min-height:40px}
.gbar .lbl{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);background:var(--canvas);padding-right:6px}
.gbar .lbl::before{content:"";width:8px;height:8px;flex:none;background:var(--signal)}
.gbar .sp{flex:1}
.gbar .back{width:40px;height:40px;margin-left:-10px;border:0;background:none;color:var(--ink);font-size:20px;display:grid;place-items:center;cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 10px;border:1px solid var(--rule-strong);background:var(--sheet);
  color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:var(--r-sm)}
.chip.mono{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.06em}
.gate .steps i{height:2px;background:var(--rule-strong)}
.gate .steps i.on{background:var(--signal)}

.brand{display:grid;justify-items:center;gap:12px;text-align:center}
.brand svg{height:76px}
.brand .wm{font-size:22px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);padding:0 6px}
.brand .wm span{font-weight:300}
.brand p{font-size:15px;color:var(--ink-2);padding:0 6px}
.gate h2{font-size:26px;font-weight:600;letter-spacing:-.02em;justify-self:start;width:fit-content}
.gate .sub{font-size:14px;color:var(--ink-2);line-height:1.55;margin-top:6px;width:fit-content}

/* CTA — the exchange's SIGN IN button */
.cta{width:100%;min-height:52px;background:var(--signal);color:#fff;font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.22em;text-transform:uppercase}
.cta:hover{background:color-mix(in srgb,var(--signal) 88%,#000)}
.cta[disabled]{opacity:.5}
.btn.ghost.tall{width:100%;min-height:52px;background:var(--sheet);font-weight:600}

.gate label{color:var(--ink);font-weight:600;font-size:13px;margin-bottom:6px}
.gate label .req{color:var(--signal)}
.gate input{background:var(--sheet);min-height:52px;font-size:15px}
.pw{position:relative}.pw input{padding-right:48px}
.pw button{position:absolute;right:6px;top:50%;translate:0 -50%;width:40px;height:40px;border:0;background:none;color:var(--ink-3);font-size:18px;cursor:pointer}
.gate .err{color:var(--loss)}
.row2{display:flex;align-items:center;justify-content:space-between;font-size:14px}
.row2 label{display:flex;align-items:center;gap:10px;margin:0;font-weight:400;font-size:14px;cursor:pointer}
.row2 input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--deep)}
.row2 a,.gate .link{color:var(--signal);font-weight:600;font-size:14px}
.or{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:var(--ink-3)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--rule)}
.soc{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.gseg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border:1px solid var(--rule);background:var(--sheet)}
.gseg button{min-height:44px;border:0;background:none;font:inherit;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.gseg button[aria-pressed=true]{background:var(--deep);color:#fff}
.fine{font-size:var(--t-label);color:var(--ink-3);text-align:center;line-height:1.5;justify-self:center;padding:0 6px}

/* welcome: three ruled feature rows with pastel badges */
.feat{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule)}
.feat div{display:flex;gap:var(--s3);align-items:center;padding:14px var(--s4);background:var(--sheet)}
.feat i{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:20px;color:var(--deep);background:var(--tone)}
.feat b{display:block;font-size:14px;font-weight:600}
.feat small{display:block;font-size:var(--t-label);color:var(--ink-3)}
.feat em{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-4)}

/* account found / summary — the lilac hero card */
.gate .hero{padding:var(--s5)}
.gate .hero .pair .coin{background:linear-gradient(135deg,var(--flag),var(--signal));color:var(--deep)}
.gate .hero .quad{margin-top:var(--s4)}
/* stat quad, from the web dashboard */
.quad{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-soft);border:1px solid var(--rule-soft)}
.quad > div{background:var(--sheet);padding:var(--s3) var(--s4)}
.quad .v{font-size:var(--t-h4);font-weight:600;margin-top:2px}

/* PIN: six ledger cells, ruled keypad */
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.cells i{aspect-ratio:1/1.15;display:grid;place-items:center;border:1px solid var(--rule-strong);background:var(--sheet);transition:border-color .14s var(--ease)}
.cells i.on::after{content:"";width:10px;height:10px;background:var(--deep)}
:root[data-theme="dark"] .cells i.on::after{background:var(--signal)}
.cells i.cur{border-color:var(--signal);box-shadow:0 0 0 3px var(--ring)}
.cells.shake{animation:sh .3s}
.cells.bad i{border-color:var(--loss)}
@keyframes sh{25%{translate:-6px}75%{translate:6px}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.keys button{min-height:52px;border:0;background:var(--sheet);color:var(--ink);font:inherit;font-size:24px;font-weight:500;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:background .1s}
.keys button small{font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--ink-3);height:11px}
.keys button:hover{background:var(--tint)}
.keys button:active{background:var(--hero)}
.keys .fn{font-size:22px;color:var(--ink-2)}
.keys .fn.on{color:var(--signal)}
.keys span{background:var(--sheet)}
/* PIN setup: cells in the lilac card, live rules below */
.pinc{display:grid;gap:var(--s3);padding:var(--s4) var(--s5)}
.pinc .cells i{aspect-ratio:1}
.pinc .pmsg{min-height:0;font-size:12px}
.pinc .cells i{background:var(--sheet)}
.rules{padding:var(--s4) var(--s5)}
.rules h3{margin-bottom:var(--s2)}
.rules .rule{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--rule-soft);font-size:14px;color:var(--ink-3)}
.rules .rule:first-of-type{border-top:0}
.rules .rule i{font-size:16px}
.rules .rule.ok{color:var(--ink)}
.rules .rule.ok i{color:var(--gain)}
.rules .rule.no i{color:var(--loss)}
.rules .foot{display:flex;align-items:center;gap:8px;margin-top:var(--s2);padding-top:var(--s3);border-top:1px solid var(--rule-soft);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.keys button:focus-visible{outline-offset:-3px;border-radius:0}
/* recovery kit: numbered groups under a veil until revealed */
.rkit{position:relative;border:1px solid var(--rule);background:var(--sheet)}
.rkit ol{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule-soft);list-style:none;counter-reset:g}
.rkit li{counter-increment:g;display:flex;align-items:baseline;gap:10px;padding:12px 14px;background:var(--sheet);font-family:var(--mono);font-size:18px;letter-spacing:.14em}
.rkit li::before{content:counter(g,decimal-leading-zero);font-size:10.5px;letter-spacing:.08em;color:var(--ink-3)}
.rkit[data-hidden="1"] ol{filter:blur(7px);user-select:none}
.rveil{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;cursor:pointer;
  background:color-mix(in srgb,var(--hero) 70%,transparent);color:var(--deep);font:inherit;font-weight:600;font-size:15px}
:root[data-theme="dark"] .rveil{color:var(--ink)}
.rveil i{font-size:22px}
.rveil small{font-weight:400;font-size:12px;color:var(--ink-2)}
.rkit[data-hidden="1"] .rveil{display:flex}
/* QR scanner — dark full-column view; the viewfinder is the brand's corner brackets */
.scan{position:fixed;top:0;bottom:0;left:50%;width:min(430px,100%);translate:-50% 0;z-index:35;background:#0c0a10;color:#fff;overflow:hidden}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .shade{position:absolute;inset:0;display:flex;flex-direction:column;padding:var(--s4) var(--s5) calc(var(--s6) + env(safe-area-inset-bottom));gap:var(--s4)}
.scan .top{display:flex;align-items:center;gap:var(--s3)}
.scan .top .lbl{flex:1;display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.scan .top .lbl::before{content:"";width:8px;height:8px;background:var(--signal)}
.scan .ib{border-color:rgba(255,255,255,.22);color:#fff;background:rgba(0,0,0,.25)}
.scan .ib:hover{background:rgba(255,255,255,.1);color:#fff}
.vf{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:auto;box-shadow:0 0 0 100vmax rgba(12,10,16,.55)}
.scan.nocam .vf{box-shadow:none;border:1px dashed rgba(255,255,255,.18)}
.vf::before{content:"";position:absolute;inset:0;--b:#fff;background-repeat:no-repeat;background-image:
  linear-gradient(var(--b),var(--b)),linear-gradient(var(--b),var(--b)),linear-gradient(var(--b),var(--b)),linear-gradient(var(--b),var(--b)),
  linear-gradient(var(--b),var(--b)),linear-gradient(var(--b),var(--b)),linear-gradient(var(--b),var(--b)),linear-gradient(var(--b),var(--b));
  background-size:28px 3px,3px 28px,28px 3px,3px 28px,28px 3px,3px 28px,28px 3px,3px 28px;
  background-position:0 0,0 0,100% 0,100% 0,0 100%,0 100%,100% 100%,100% 100%}
.vf i.line{position:absolute;left:10px;right:10px;height:2px;background:var(--signal);box-shadow:0 0 12px var(--signal);animation:sl 2.2s ease-in-out infinite alternate}
@keyframes sl{from{top:10%}to{top:88%}}
.scan.nocam .vf i.line{display:none}
.vf .msg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:8px;text-align:center;padding:var(--s4);color:rgba(255,255,255,.75);font-size:13px}
.vf .msg i{font-size:32px;color:rgba(255,255,255,.5)}
.scan .hint{text-align:center;font-size:14px;color:rgba(255,255,255,.8)}
.scan .acts2 .btn.ghost{color:#fff;border-color:rgba(255,255,255,.22);background:rgba(0,0,0,.25)}
.scan .acts2 .btn.ghost:hover{background:rgba(255,255,255,.1)}
.scan .sample{border:0;background:none;color:rgba(255,255,255,.5);font:inherit;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;justify-self:center}
/* empty / offline / error states */
.offbar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--flag);font-size:13px;color:var(--ink-2)}
.offbar i{font-size:16px;color:var(--ink-3)}
.offbar b{color:var(--ink);font-weight:600}
.qa button[aria-disabled=true]{opacity:.4;cursor:not-allowed;transform:none}
.state{display:grid;justify-items:center;gap:var(--s3);text-align:center;padding:var(--s8) var(--s5)}
.state .tile{width:72px;height:72px;display:grid;place-items:center;font-size:32px;color:var(--deep);background:var(--tone,#e5e1ea)}
:root[data-theme="dark"] .state .tile{opacity:.92}
.state b{font-size:var(--t-h3);font-weight:600}
.state p{font-size:14px;color:var(--ink-2);max-width:30ch;line-height:1.55}
.state .btn{min-width:160px}
.state .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fund .row{padding:14px 0}
.fund .row i.n{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:20px;color:var(--deep);background:var(--tone)}
.sk{display:block;background:linear-gradient(90deg,var(--sheet-sunk) 0 40%,var(--tint) 50%,var(--sheet-sunk) 60% 100%);background-size:250% 100%;animation:sk 1.1s linear infinite}
@keyframes sk{from{background-position:100% 0}to{background-position:-150% 0}}
.pmsg{min-height:20px;font-size:13px;text-align:center;color:var(--ink-3)}
.pmsg.err{color:var(--loss)}

/* lock header */
.who2{display:grid;justify-items:center;gap:8px;text-align:center}
.who2 .coin{width:64px;height:64px;font-size:20px;background:linear-gradient(135deg,var(--flag),var(--signal));color:var(--deep)}
.who2 h2{justify-self:center}
.who2 .meta{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);background:var(--canvas);padding:0 6px}

/* Face ID card */
.bio{display:grid;justify-items:center;gap:var(--s3);text-align:center;padding:var(--s8) var(--s5)}
.bio .tile{width:96px;height:96px;display:grid;place-items:center;font-size:48px;color:var(--deep);background:#ded6f0}
.bio b{font-size:var(--t-h4)}
.bio small{font-size:13px;color:var(--ink-3);max-width:28ch}

/* splash — the exchange's dark radial glow */
.splash{position:fixed;top:0;bottom:0;left:50%;width:min(430px,100%);translate:-50% 0;z-index:40;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 46%,rgba(232,88,95,.32),rgba(129,34,106,.22) 26%,rgba(37,22,91,.12) 46%,transparent 64%),#141019;
  transition:opacity .45s var(--ease)}
.splash.out{opacity:0;pointer-events:none}
.splash .brand .wm{color:#fff;background:none;font-size:24px}
.splash .brand p{color:rgba(255,255,255,.5);background:none}
.splash .brand svg{height:96px}
.splash .load{position:absolute;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;translate:-50% 0;width:120px;height:2px;background:rgba(255,255,255,.08);overflow:hidden}
.splash .load::after{content:"";display:block;height:100%;background:var(--signal);animation:ld 1.2s var(--ease) forwards}
@keyframes ld{from{width:0}to{width:100%}}

/* tab bar */
.tabbar{position:fixed;bottom:0;left:50%;translate:-50% 0;width:min(430px,100%);z-index:6;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--sheet);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 9px;font-size:11px;font-weight:500;color:var(--ink-3);position:relative}
.tabbar a i{font-size:20px}
.tabbar a:hover{text-decoration:none;color:var(--ink)}
.tabbar a[aria-current=page]{color:var(--ink)}
.tabbar a[aria-current=page] i{color:var(--signal)}
.tabbar a[aria-current=page]::before{content:"";position:absolute;top:-1px;left:30%;right:30%;height:2px;background:var(--signal)}

/* settings list */
.set{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-top:1px solid var(--rule-soft);font-size:14px}
.set:first-of-type{border-top:0;padding-top:0}
.set > i{font-size:18px;color:var(--ink-2);width:20px}
.set span{flex:1}
.set small{display:block;font-size:var(--t-label);color:var(--ink-3)}
.set em{font-style:normal;font-size:var(--t-label);color:var(--ink-3)}
.sw{appearance:none;-webkit-appearance:none;width:40px!important;min-height:0!important;height:22px;border-radius:11px!important;padding:0!important;
  background:var(--rule-strong)!important;position:relative;cursor:pointer;border:0!important;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:translate .16s var(--ease)}
.sw:checked{background:var(--deep)!important}
:root[data-theme="dark"] .sw:checked{background:var(--signal)!important}
.sw:checked::after{translate:18px 0}
.sw:focus{box-shadow:0 0 0 3px var(--ring)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--rule-strong);background:var(--sheet);color:var(--ink-2);font:inherit;font-size:12px;font-weight:500;
  padding:5px 10px;border-radius:var(--r-sm);cursor:pointer}
.chips button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.empty{padding:var(--s8) 0;text-align:center;color:var(--ink-3);font-size:13px}
.empty i{display:block;font-size:24px;margin-bottom:6px}
.day{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:var(--s3) 0 var(--s1)}
.tag.bad{color:var(--loss)}.tag.bad::before{background:var(--loss)}
.chart{width:100%;height:120px;display:block}
.chart path.l{fill:none;stroke:var(--signal);stroke-width:1.6}
.chart path.a{fill:var(--signal);opacity:.08}
.toast{position:fixed;left:50%;bottom:90px;translate:-50% 0;z-index:50;background:var(--ink);color:var(--canvas);font-size:13px;padding:10px 14px;border-radius:var(--r)}
.masked .mny{letter-spacing:.1em}
</style>
</head>
<body>

<!-- ================= splash + lock (drawn by the gate script) ================= -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="brand"><svg viewBox="0 0 224.34 303.37"><use href="#jx"/></svg><div class="wm">Javas <span>Wallet</span></div><p>The stablecoin desk for Hong Kong.</p></div>
  <div class="load"></div>
</div>
<div class="gate lock" id="lock" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="jx2a" x1="0" y1="209.8" x2="224.34" y2="209.8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dd3b8c"/><stop offset=".14" stop-color="#b6307e"/><stop offset=".35" stop-color="#81226a"/><stop offset=".56" stop-color="#56165b"/><stop offset=".74" stop-color="#380e50"/><stop offset=".89" stop-color="#250949"/><stop offset="1" stop-color="#1f0847"/></linearGradient><linearGradient id="jx2b" x1="112.17" y1="68.39" x2="112.17" y2="240.23" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dd3b8c"/><stop offset=".14" stop-color="#b6307e"/><stop offset=".35" stop-color="#81226a"/><stop offset=".56" stop-color="#56165b"/><stop offset=".74" stop-color="#380e50"/><stop offset=".89" stop-color="#250949"/><stop offset="1" stop-color="#1f0847"/></linearGradient><linearGradient id="jx2c" x1="140.21" y1="-89.55" x2="140.21" y2="262.61" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff9700"/><stop offset="1" stop-color="#dd3b8c"/></linearGradient>
  <g id="jx"><path fill="url(#jx2a)" d="M112.17,201.81v-7.780c0-42.96-50.22-77.79-112.17-77.79v109.34c0,42.96,50.22,77.79,112.17,77.79s112.17-34.83,112.17-77.79-50.22-23.77-112.17-23.77Z"/><path fill="url(#jx2b)" d="M112.17,252.59v7.78c39.15,0,73.6-13.09,93.67,8,11.68-12.28,18.5-26.97,18.5-42.78,0-42.96-50.22-23.77-112.17-23.77v-7.78c0-42.96-50.22-77.79-112.17-77.79v58.56c61.950,0,112.17,34.83,112.17,77.79Z"/><path fill="url(#jx2c)" d="M224.34,0c-61.95,0-112.17,34.83-112.17,77.79v147.79c0,28.79-22.57,53.9-56.08,67.35,16.5,6.62,35.65,10.43,56.08,10.43,61.95,0,112.17-34.83,112.17-77.79V0h0Z"/></g>
</defs></svg>

<div class="gate onb" id="onb" hidden><div class="wrap"></div></div>

<div class="app" id="app">
  <header class="hd" id="hd"></header>
  <main class="pg" id="pg" style="background:none;padding:var(--s4)"></main>
</div>

<nav class="tabbar" aria-label="Main">
  <a href="#/"><i class="ri-wallet-3-line"></i>Wallet</a>
  <a href="#/activity"><i class="ri-file-list-3-line"></i>Activity</a>

<div class="scan" id="scan" hidden role="dialog" aria-modal="true" aria-label="Scan QR code"></div>
<dialog class="sheet" id="sheet" aria-labelledby="sh-t"><div class="in" id="sh"></div></dialog>

<script>
/* ponytail: sample data only — same holdings and prices the web wallet shows. Swap HOLD / TX
   for the wallet API; nothing is signed or broadcast from this page. */
const HOLD = [
  ['USDT','Tether',318420,7.8241,'#26a17b','₮',['Ethereum (ERC-20)','Tron (TRC-20)','Solana'],0.01],
  ['BTC','Bitcoin',2.1840,83560.20*7.8241,'#f7931a','₿',['Bitcoin'],1.82],
  ['ETH','Ethereum',34.60,2692.40*7.8241,'#627eea','Ξ',['Ethereum (ERC-20)'],-0.61],
  ['USDC','USD Coin',21400,7.8198,'#2775ca','$',['Ethereum (ERC-20)','Solana'],0.02],
  ['SOL','Solana',5,117.17*7.8241,'#14b37a','◎',['Solana'],0.18],
  ['XRP','XRP',200,1.5856*7.8241,'#23292f','✕',['XRP Ledger'],3.66],
  ['LINK','Chainlink',19.942,12.91*7.8241,'#2a5ada','L',['Ethereum (ERC-20)'],-1.12],
].map(([sym,name,amt,px,col,gl,nets,chg]) => ({sym,name,amt,px,col,gl,nets,chg,value:amt*px}));
const BY = Object.fromEntries(HOLD.map(h => [h.sym, h]));
const FEE = { BTC:0.0002, ETH:0.0015, SOL:0.01, XRP:0.2, LINK:0.3, USDT:1, USDC:1 };
const BOOK = [ // whitelisted addresses
  { name:'Javas Exchange account', note:'Spot wallet · UID 9642943', sym:'*', net:'*', addr:'internal' },
  { name:'Treasury cold wallet', note:'Ethereum (ERC-20)', sym:'*', net:'Ethereum (ERC-20)', addr:'0x3f9a…c41e' },
  { name:'Fireblocks vault', note:'Bitcoin', sym:'BTC', net:'Bitcoin', addr:'bc1q…9c2e' },
  { name:'OTC settlement', note:'Tron (TRC-20)', sym:'USDT', net:'Tron (TRC-20)', addr:'TQ7x…kP2a' },
];
const TX = [
  ['in','USDT',50000,'From Javas Exchange account','Today · 10:44','ok','Completed'],
  ['out','BTC',0.25,'To Fireblocks vault ••9c2e','Today · 09:12','pend','Confirming 2/3'],
  ['swap','ETH',1.2,'Swapped from 3,230.88 USDT','Yesterday · 18:03','ok','Completed'],
  ['in','SOL',5,'From 7Hk2…aQ9d','Yesterday · 11:20','ok','Completed'],
  ['out','USDT',12000,'To OTC settlement ••Q7xk','16 Oct · 15:47','ok','Completed'],
  ['out','ETH',4,'To 0x91c0…f22a','14 Oct · 08:30','bad','Rejected by approver'],
  ['in','BTC',0.5,'From Javas Exchange account','12 Oct · 21:05','ok','Completed'],
].map(([dir,sym,amt,who,when,st,stx],i) => ({id:i,dir,sym,amt,who,when,st,stx}));

const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);
const dp = h => h.px < 50 ? 2 : 4;
const f = (v, d = 2) => v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const TOTAL = HOLD.reduce((t, h) => t + h.value, 0);
let hidden = false, cur = 'HKD';
try { hidden = localStorage.getItem('jvx:hide') === '1'; cur = localStorage.getItem('jvx:wcur') || 'HKD'; } catch (e) {}
const RATE = { HKD:1, USD:1/7.8203, USDT:1/7.8241 }, PRE = { HKD:'HK$ ', USD:'US$ ', USDT:'' }, SUF = { HKD:'', USD:'', USDT:' USDT' };
const money = hkd => hidden ? '••••••' : PRE[cur] + f(hkd * RATE[cur]) + SUF[cur];
const mask = s => hidden ? '••••' : s;
const coin = (h, lg) => `<div class="coin${lg ? ' lg' : ''}" style="background:${h.col}" aria-hidden="true">${h.gl}</div>`;
const chg = c => `<span class="${c >= 0 ? 'gain' : 'loss'}">${f(Math.abs(c))}%</span>`;
const LOGO = `<div class="logo"><svg viewBox="0 0 224.34 303.37" aria-hidden="true"><use href="#jx"/></svg><b>Javas <span>Wallet</span></b></div>`;
const toast = t => { const d = Object.assign(document.createElement('div'), { className:'toast', role:'status', textContent:t }); document.body.append(d); setTimeout(() => d.remove(), 2200); };

/* deterministic fakes — shaped like the network's, never real (same as web wallet) */
const hash = s => [...s].reduce((h, c) => Math.imul(h, 31) + c.charCodeAt(0) | 0, 7) >>> 0;
const addrFor = (sym, net) => {
  let s = hash(sym + net);
  const pick = (al, n) => { let r = ''; for (let i = 0; i < n; i++) { s = Math.imul(s ^ s >>> 13, 1597334677) >>> 0; r += al[s % al.length]; } return r; };
  const b58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz', b32 = '023456789acdefghjklmnpqrstuvwxyz';
  if (net.includes('ERC')) return '0x' + pick('0123456789abcdef', 40);
  if (net.includes('Tron')) return 'T' + pick(b58, 33);
  if (net === 'Bitcoin') return 'bc1q' + pick(b32, 38);
  if (net === 'XRP Ledger') return 'r' + pick(b58, 33);
  return pick(b58, 44);
};
const qrFor = text => {   // decorative only: looks like a QR, encodes nothing
  let s = hash(text), d = '';
  const fin = (x, y) => (x < 8 && y < 8) || (x > 20 && y < 8) || (x < 8 && y > 20);
  for (let y = 0; y < 29; y++) for (let x = 0; x < 29; x++) { s = Math.imul(s ^ s >>> 13, 1597334677) >>> 0; if (!fin(x, y) && s % 100 < 48) d += `M${x} ${y}h1v1h-1z`; }
  const F = (x, y) => `<path d="M${x} ${y}h7v7h-7z M${x+1} ${y+1}v5h5v-5z" fill-rule="evenodd"/><path d="M${x+2} ${y+2}h3v3h-3z"/>`;
  return `<svg viewBox="0 0 29 29" shape-rendering="crispEdges" aria-hidden="true"><g fill="#25165b"><path d="${d}"/>${F(0,0)}${F(22,0)}${F(0,22)}</g></svg>`;
};
const spark = (seed, up) => { // decorative 30-day line
  let s = hash(seed), y = 60, pts = [];
  for (let i = 0; i <= 30; i++) { s = Math.imul(s ^ s >>> 13, 1597334677) >>> 0; y += (s % 100 - (up ? 46 : 54)) / 6; y = Math.max(10, Math.min(110, y)); pts.push([i * 10, 120 - y]); }
  const l = 'M' + pts.map(p => p.join(' ')).join('L');
  return `<svg class="chart" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="${l}L300 120L0 120Z"/><path class="l" d="${l}"/></svg>`;
};

/* ================= screens ================= */
const txRow = t => {
  const h = BY[t.sym], ic = { in:'ri-arrow-down-line', out:'ri-arrow-up-line', swap:'ri-arrow-left-right-line' }[t.dir];
  const sign = t.dir === 'out' ? '−' : '+';
  return `<button class="row act" data-tx="${t.id}" style="padding:var(--s3) 0"><div class="ic"><i class="${ic}"></i></div>
    <div class="m"><div class="nm">${{ in:'Received', out:'Sent', swap:'Swapped to' }[t.dir]} ${t.sym}</div><div class="sm">${t.who}</div></div>
    <div class="r"><div class="amt mny">${mask(sign + f(t.amt, dp(h)) + ' ' + t.sym)}</div><span class="tag ${t.st}">${t.stx}</span></div></button>`;
};

const SCREENS = {
  '/': () => {
    const big = [...HOLD].sort((a, b) => b.value - a.value);
    return {
      hd: `${LOGO}<span class="sp"></span><button class="ib" data-act="scan" aria-label="Scan QR code"><i class="ri-qr-scan-2-line"></i></button><button class="ib" data-act="notes" aria-label="Notifications, 2 new"><i class="ri-notification-3-line"></i><span class="dot"></span></button>`,
      body: `
      <section class="card hero">
        <div class="kh"><button class="wsel" data-act="cur" aria-label="Display currency">${cur} <i class="ri-arrow-down-s-line"></i></button>
          <button class="eye" data-act="hide" aria-pressed="${hidden}"><i class="${hidden ? 'ri-eye-line' : 'ri-eye-off-line'}"></i>${hidden ? 'Show' : 'Hide'}</button></div>
        <div class="k" style="margin-top:var(--s4)">Total wallet balance</div>
        <div class="figure mny">${money(TOTAL)}</div>
        <div class="eq mny">${hidden ? '≈ ••••' : `≈ ${f(TOTAL / BY.BTC.px, 4)} BTC`}</div>
        <div class="pnl gain">${mask('HK$ 48,212.40')} · 0.72% today</div>
        <div class="alloc" role="img" aria-label="Allocation by asset">${big.map(h => `<i style="flex:${h.value};background:${h.col}"></i>`).join('')}</div>
      </section>
      <nav class="qa" aria-label="Wallet actions">
        <button class="blush" data-act="send"><i class="ri-arrow-up-line"></i>Send</button>
        <button class="mist" data-act="receive"><i class="ri-arrow-down-line"></i>Receive</button>
        <button class="lilac" data-go="/swap"><i class="ri-arrow-left-right-line"></i>Swap</button>
        <button class="sand" data-act="transfer"><i class="ri-exchange-funds-line"></i>Transfer</button>
      </nav>
      <section class="card">
        <h3>Assets <a href="#/activity">History</a></h3>
        ${big.map(h => `<button class="row" data-go="/asset/${h.sym}">${coin(h)}
          <div class="m"><div class="nm">${h.sym}</div><div class="sm">${h.name} · ${chg(h.chg)}</div></div>
          <div class="r"><div class="mny">${mask(f(h.amt, dp(h)))}</div><span class="sm mny">${money(h.value)}</span></div></button>`).join('')}
      </section>
      <section class="card">
        <h3>Recent activity <a href="#/activity">See all</a></h3>
        ${TX.slice(0, 3).map(txRow).join('')}
      </section>`
    };
  },

  '/asset': sym => {
    const h = BY[sym]; if (!h) return SCREENS['/']();
    const tx = TX.filter(t => t.sym === sym);
    return {
      hd: `<button class="ib bare" data-go="/" aria-label="Back"><i class="ri-arrow-left-line"></i></button><h1>${h.name}</h1>`,
      body: `
      <section class="card hero">
        <div class="kh"><div class="pair">${coin(h, 1)}<div><div class="nm">${h.sym}</div><div class="sm">${h.nets.join(' · ')}</div></div></div></div>
        <div class="figure mny" style="margin-top:var(--s4)">${mask(f(h.amt, dp(h)) + ' ' + h.sym)}</div>
        <div class="eq mny">${money(h.value)}</div>
        <div class="acts2" style="margin-top:var(--s4)">
          <button class="btn" data-act="send" data-sym="${sym}"><i class="ri-arrow-up-line"></i>Send</button>
          <button class="btn ghost" data-act="receive" data-sym="${sym}"><i class="ri-arrow-down-line"></i>Receive</button>
        </div>
      </section>
      <section class="card">
        <h3>Price · 30d</h3>
        <div class="kh"><b style="font-size:var(--t-h2);font-variant-numeric:tabular-nums">HK$ ${f(h.px, h.px < 50 ? 4 : 2)}</b>${chg(h.chg)}</div>
        ${spark(sym, h.chg >= 0)}
        <a class="btn ghost" style="width:100%;margin-top:var(--s3)" href="https://javas-exchange.vercel.app/trade.html" target="_blank" rel="noopener"><i class="ri-exchange-line"></i>Trade on Javas Exchange</a>
      </section>
      <section class="card"><h3>Activity</h3>${tx.length ? tx.map(txRow).join('') : '<p class="empty"><i class="ri-inbox-line"></i>No activity yet.</p>'}</section>`
    };
  },

  '/activity': () => ({
    hd: `<h1>Activity</h1><button class="ib" data-act="export" aria-label="Export statement"><i class="ri-download-2-line"></i></button>`,
    body: `
      <div class="chips" role="group" aria-label="Filter">${['All','Received','Sent','Swaps','Pending'].map((c, i) => `<button data-f="${c}" aria-pressed="${i === 0}">${c}</button>`).join('')}</div>
      <section class="card" id="txs"></section>`
  }),

  '/swap': () => ({
    hd: `<h1>Swap</h1>`,
    body: `
      <section class="card">
        <h3>Convert between assets</h3>
        <div class="fl"><label for="sf">You pay <b id="sfb"></b></label>

/* recovery backup: status → 2FA → reveal kit → prove it's saved → done.
   ponytail: the code is a stable fake per account; the custody API issues the real one. */
const BACKUP = { verified: null };
const RCODE = (() => {
  let s = hash('9642943'), out = [];
  const al = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';   // no 0/O/1/I — easy to copy by hand
  for (let g = 0; g < 6; g++) { let w = ''; for (let i = 0; i < 4; i++) { s = Math.imul(s ^ s >>> 13, 1597334677) >>> 0; w += al[s % al.length]; } out.push(w); }
  return out;
})();
function backup() {
  const v = BACKUP.verified;

/* ---- transaction helpers: network, hash, reference, date ----
   ponytail: hashes are stable fakes shaped like each chain's; the wallet API returns real ones. */
const txInternal = t => t.dir === 'swap' || t.who.includes('Javas Exchange');
const txNet = t => t.who.includes('OTC settlement') ? 'Tron (TRC-20)' : BY[t.sym].nets[0];
const txRef = t => 'JVX-TX-' + String(90412 + t.id * 37);
const txHash = t => {
  const net = txNet(t); let x = hash('tx' + t.id + net), r = '';
  const pick = (al, n) => { for (let i = 0; i < n; i++) { x = Math.imul(x ^ x >>> 13, 1597334677) >>> 0; r += al[x % al.length]; } return r; };
  if (net === 'Solana') return pick('123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz', 88);
  const hex = pick('0123456789abcdef', 64);
  return net.includes('ERC') ? '0x' + hex : net === 'XRP Ledger' ? hex.toUpperCase() : hex;
};
const EXPLORERS = {
  'Ethereum (ERC-20)': ['Etherscan', 'https://etherscan.io/tx/'], 'Tron (TRC-20)': ['Tronscan', 'https://tronscan.org/#/transaction/'],
  'Bitcoin': ['mempool.space', 'https://mempool.space/tx/'], 'Solana': ['Solscan', 'https://solscan.io/tx/'], 'XRP Ledger': ['XRPSCAN', 'https://xrpscan.com/tx/'],

const NOW = new Date();
const hkDay = d => d.toLocaleDateString('en-CA', { timeZone: 'Asia/Hong_Kong' });               // 'YYYY-MM-DD'
const hkStamp = d => d.toLocaleString('sv-SE', { timeZone: 'Asia/Hong_Kong' }).slice(0, 16);     // 'YYYY-MM-DD HH:MM'
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const txDate = t => {   // 'Today · 10:44' / 'Yesterday · …' / '16 Oct · 15:47' (HKT) → Date
  const [d, hm] = t.when.split(' · ');
  let day = d === 'Today' ? hkDay(NOW) : d === 'Yesterday' ? hkDay(new Date(NOW - 864e5)) : null;
  if (!day) { const [dd, mm] = d.split(' '); day = `${hkDay(NOW).slice(0, 4)}-${String(MON.indexOf(mm) + 1).padStart(2, '0')}-${dd.padStart(2, '0')}`; }
  return new Date(`${day}T${hm}:00+08:00`);
};

/* export statement: CSV is built here and downloaded; PDF is emailed by the backend.
   ponytail: CSV covers the sample TX list; the statements API covers full history. */
function exportStatement() {
  const [Y, M] = hkDay(NOW).split('-').map(Number), pad = n => String(n).padStart(2, '0');
  const lastY = M === 1 ? Y - 1 : Y, lastM = M === 1 ? 12 : M - 1, lastEnd = new Date(Date.UTC(Y, M - 1, 0)).getUTCDate();
  const P = { this: [`${Y}-${pad(M)}-01`, hkDay(NOW)], last: [`${lastY}-${pad(lastM)}-01`, `${lastY}-${pad(lastM)}-${lastEnd}`] };
  const iso = hkDay;
  let period = 'this', fmt = 'csv';
  openSheet(`<div class="sh"><h2 id="sh-t">Export statement</h2>${X}</div>
    <div class="fl"><label>Period</label><div class="seg" role="group" aria-label="Period"><button data-p="this" aria-pressed="true">This month</button><button data-p="last" aria-pressed="false">Last month</button><button data-p="custom" aria-pressed="false">Custom</button></div></div>
    <div class="acts2" id="xcustom" hidden><div class="fl"><label for="xf">From</label><input type="date" id="xf"></div><div class="fl"><label for="xt">To</label><input type="date" id="xt"></div></div>
    <div class="fl"><label for="xa">Assets</label><select id="xa"><option value="*">All assets</option>${HOLD.map(h => `<option value="${h.sym}">${h.sym} — ${h.name}</option>`).join('')}</select></div>
    <div class="fl"><label>Format</label><div class="seg" role="group" aria-label="Format"><button data-x-f="csv" aria-pressed="true">CSV · spreadsheet</button><button data-x-f="pdf" aria-pressed="false">PDF · statement</button></div></div>
    <div class="info"><div><span>Transactions</span><b id="xn"></b></div><div><span>Delivery</span><b id="xd"></b></div></div>
    <p class="err" id="xer" hidden></p>
    <button class="btn full" id="xgo"><i class="ri-download-2-line"></i>Export</button>`);
  const range = () => period === 'custom' ? [$('#xf').value, $('#xt').value] : P[period];
  const rows = () => {
    const [a, b] = range(), sym = $('#xa').value;
    return TX.filter(t => (sym === '*' || t.sym === sym) && (!a || iso(txDate(t)) >= a) && (!b || iso(txDate(t)) <= b));
  };
  const upd = () => {
    const [a, b] = range(), bad = a && b && a > b ? '"From" is after "To".' : '';
    $('#xer').textContent = bad; $('#xer').hidden = !bad;
    $('#xn').textContent = bad ? '—' : rows().length;
    $('#xd').textContent = fmt === 'csv' ? 'Downloads to this device' : 'Emailed to w•••@chantrading.com.hk';
    $('#xgo').disabled = !!bad || (period === 'custom' && !(a && b));
    $('#xgo').innerHTML = fmt === 'csv' ? '<i class="ri-download-2-line"></i>Download CSV' : '<i class="ri-mail-send-line"></i>Email PDF';
  };
  sh.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { period = b.dataset.p; sh.querySelectorAll('[data-p]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#xcustom').hidden = period !== 'custom'; upd(); });
  sh.querySelectorAll('[data-x-f]').forEach(b => b.onclick = () => { fmt = b.dataset.xF; sh.querySelectorAll('[data-x-f]').forEach(x => x.setAttribute('aria-pressed', x === b)); upd(); });
  ['xf', 'xt', 'xa'].forEach(i => $('#' + i).onchange = upd);
  $('#xgo').onclick = () => {
    const list = rows(), [a, b] = range();
    if (fmt === 'pdf') return doneSheet('Statement on its way', `Your PDF for ${a} to ${b} will arrive by email within a few minutes.`);
    if (!list.length) return toast('No transactions in this period');
    const cell = v => /[",\n]/.test(v) ? `"${String(v).replace(/"/g, '""')}"` : v;
    const csv = [['Date (HKT)', 'Type', 'Asset', 'Amount', 'Value (HKD)', 'Counterparty', 'Status', 'Network', 'Tx hash / reference'],
      ...list.map(t => [hkStamp(txDate(t)), { in: 'Receive', out: 'Send', swap: 'Swap' }[t.dir], t.sym,
        (t.dir === 'out' ? '-' : '') + t.amt, (t.amt * BY[t.sym].px).toFixed(2), t.who, t.stx, txInternal(t) ? 'Internal' : txNet(t), txInternal(t) ? txRef(t) : txHash(t)])]
      .map(r => r.map(cell).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));   // BOM so Excel reads UTF-8
    Object.assign(document.createElement('a'), { href: url, download: `javas-wallet-statement-${a}-to-${b}.csv` }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    doneSheet('Statement downloaded', `${list.length} transactions, ${a} to ${b}.`);
  };
  upd();
}

/* ================= global clicks ================= */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { location.hash = '#' + go.dataset.go; return; }
  const dn = e.target.closest('[data-done]'); if (dn) { const [t, m] = dn.dataset.done.split('|'); doneSheet(t, m); return; }
  const tx = e.target.closest('[data-tx]'); if (tx) return txDetail(TX[tx.dataset.tx]);
  const dm = e.target.closest('[data-demo]'); if (dm) { DEMO = dm.dataset.demo; render(); toast(`Preview: ${dm.textContent}`); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'retry') { $('#pg').innerHTML = (isOffline() ? OFFBAR() : '') + SKELETON; setTimeout(() => { DEMO = 'normal'; render(); }, 1200); return; }
  if (isOffline() && NEEDS_NET.includes(a)) return toast("You're offline — this needs a connection");
  if (b.getAttribute('aria-disabled') === 'true') return toast(a === 'send' ? 'Nothing to send yet — add funds first' : 'Add funds first, then swap');
  if (a === 'send') send(b.dataset.sym);
  else if (a === 'receive') receive(b.dataset.sym);
  else if (a === 'transfer') transfer();
  else if (a === 'hide') { hidden = !hidden; try { localStorage.setItem('jvx:hide', hidden ? '1' : '0'); } catch (x) {} render(); }
  else if (a === 'cur') { const k = Object.keys(RATE); setCur(k[(k.indexOf(cur) + 1) % k.length]); render(); }
  else if (a === 'lock') lock();
  else if (a === 'onboard') startOnboarding();
  else if (a === 'addaddr') addAddress();
  else if (a === 'changepin') changePin();
  else if (a === 'backup') backup();
  else if (a === 'notes') openSheet(`<div class="sh"><h2 id="sh-t">Notifications</h2>${X}</div>
      <div class="act"><div class="ic"><i class="ri-arrow-up-line"></i></div><div class="m"><div class="t">BTC send confirming</div><div class="s">0.25 BTC to Fireblocks vault · 2/3 confirmations</div></div></div>

  else if (a === 'scan') { if (sheet.open) sheet.close(); scanToSend(); }
  else if (a === 'export') exportStatement();
  else toast('Coming soon');
});

};
const PIN_COPY = {
  cur: { h: 'Enter current PIN', sub: "Confirm it's you before choosing a new one.", k: 'Current PIN', msg: 'Enter 6 digits' },
  pin: { h: 'Create a PIN', sub: 'Six digits to unlock the wallet. Avoid birthdays and repeats.', k: 'New PIN', msg: 'Choose 6 digits' },
  confirm: { h: 'Confirm your PIN', sub: 'Enter the same six digits again.', k: 'Confirm PIN', msg: 'Re-enter 6 digits' },
};
// live PIN rules: ✓ when met, ✕ as soon as the digits so far break one, blank while undecided
const pinRules = p => {
  const run = p.length > 2 && ('0123456789'.includes(p) || '9876543210'.includes(p)), same = p.length > 1 && /^(\d)\1+$/.test(p), full = p.length === 6;
  const st = {
    len: full ? 'ok' : '',
    rep: same ? 'no' : full ? 'ok' : '',
    seq: run ? 'no' : full ? 'ok' : '',
    match: p && !ONB.first.startsWith(p) ? 'no' : full ? 'ok' : '',
    diff: full && p === ONB.old ? 'no' : full ? 'ok' : '',
  };
  onb.querySelectorAll('[data-r]').forEach(r => {
    const v = st[r.dataset.r]; r.className = 'rule ' + v;
    r.querySelector('i').className = v === 'ok' ? 'ri-checkbox-circle-fill' : v === 'no' ? 'ri-close-circle-fill' : 'ri-checkbox-blank-circle-line';
  });
  const c = $('#ocount'); if (c) c.textContent = `${p.length} / 6`;
};
const opinKey = k => {
  if (k === 'del') ONB.pin = ONB.pin.slice(0, -1); else if (ONB.pin.length < 6) ONB.pin += k;
  paintCells('opins', ONB.pin.length);
  pinRules(ONB.pin);
  const m = $('#omsg'); m.classList.remove('err'); m.textContent = PIN_COPY[ONB.step].msg;
  if (ONB.pin.length < 6) return;
  setTimeout(() => {
    const p = ONB.pin; ONB.pin = '';
    // ponytail: preview accepts any current PIN; the native shell checks it against secure storage
    if (ONB.step === 'cur') { ONB.old = p; ONB.step = 'pin'; onbDraw(); }
    else if (ONB.step === 'pin') {
      if (/^(\d)\1{5}$/.test(p) || '0123456789'.includes(p) || '9876543210'.includes(p)) return failCells('opins', m, 'Too easy to guess. Try another.');
      if (p === ONB.old) return failCells('opins', m, 'Pick a PIN different from your current one.');
      ONB.first = p; ONB.step = 'confirm'; onbDraw();
    } else if (p !== ONB.first) failCells('opins', m, "PINs don't match. Try again.");
    else if (ONB.mode === 'change') { onb.hidden = true; toast('PIN changed'); }
    else { ONB.step = 'bio'; onbDraw(); }
  }, 140);
};
onb.addEventListener('click', e => {
  const k = e.target.closest('.keys [data-k]'); if (k) return opinKey(k.dataset.k);
  const b = e.target.closest('[data-ob]'); if (!b) return;
  e.preventDefault();
  const to = b.dataset.ob;
  if (to === 'lang') return toast('Coming soon');
  if (to === 'close') { onb.hidden = true; return; }
  if (to === 'forgotpin') { toast('Sign in again to set a new PIN'); return startOnboarding('signin'); }
  if (to === 'forgotpw') return toast('Reset your password in the Javas Exchange app');
  if (to === 'create') return open('https://javas-exchange-mobile.vercel.app', '_blank', 'noopener');
  if (to === 'finish') { try { localStorage.setItem('jvx:onboarded', '1'); } catch (x) {} onb.hidden = true; lockEl.hidden = true; render(); return; }
  if (b.dataset.bio) { ONB.bio = true; toast('Face ID turned on'); }
  ONB.pin = ''; ONB.step = to; onbDraw();
});
addEventListener('keydown', e => { if (onb.hidden || !PIN_COPY[ONB.step]) return; if (/^\d$/.test(e.key)) opinKey(e.key); else if (e.key === 'Backspace') opinKey('del'); });
const startOnboarding = (step = 'welcome', mode = 'setup') => { Object.assign(ONB, { mode, step, pin: '', first: '', old: '', email: '', bio: false }); onbDraw(); onb.hidden = false; };
const changePin = () => startOnboarding('cur', 'change');

/* ================= boot: splash → setup or lock ================= */
let onboarded = false;
try { onboarded = localStorage.getItem('jvx:onboarded') === '1'; } catch (e) {}
if (onboarded) lock(); else startOnboarding();
render();
setTimeout(() => { const s = $('#splash'); s.classList.add('out'); setTimeout(() => s.remove(), 500); }, 1300);
</script>
</body>
</html>
